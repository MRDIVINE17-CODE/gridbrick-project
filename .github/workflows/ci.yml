name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leeway .
      - name: Smoke test the container
        run: |
          docker run -d --name leeway -p 8000:8000 leeway
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/day/2026-01-15 > /dev/null
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
